<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warenkorb</title>

<style>

body{
background:#050505;
color:white;
font-family:Arial;
padding:50px;
}

.item{
display:flex;
gap:30px;
background:#111;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.item img{
width:160px;
border-radius:20px;
}

.total{
font-size:40px;
margin-top:40px;
color:#ffb8d9;
font-weight:bold;
}

</style>

</head>

<body>

<h1>Warenkorb</h1>

<div id="cart"></div>

<div class="total" id="total"></div>

<script>

const cartData = JSON.parse(localStorage.getItem('elinaCart')) || [];

const cart = document.getElementById('cart');

const total = document.getElementById('total');

let sum = 0;

cartData.forEach(item=>{

sum += item.price;

cart.innerHTML += `
<div class="item">

<img src="${item.image}">

<div>
<h2>${item.name}</h2>
<p>Größe: ${item.size}</p>
<p>CHF ${item.price}</p>
</div>

</div>
`;

});

total.innerText = "Gesamt: CHF " + sum.toFixed(2);

</script>

</body>
</html>
