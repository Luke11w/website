<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Warenkorb</title><style>body{background:#050505;color:white;font-family:Arial;margin:0;padding:0}header{display:flex;justify-content:space-between;align-items:center;padding:25px 50px;background:#0b0b0b;border-bottom:1px solid #222;position:sticky;top:0;z-index:999}.logo{font-size:32px;font-weight:900;letter-spacing:4px}nav{display:flex;gap:25px}nav a{color:white;text-decoration:none;font-weight:bold}.container{padding:50px}h1{font-size:70px;margin-bottom:40px}.item{display:flex;justify-content:space-between;gap:30px;background:#111;padding:20px;border-radius:30px;margin-bottom:25px;align-items:center}.left{display:flex;gap:30px;align-items:center}.item img{width:160px;border-radius:20px;background:#0a0a0a}.item h2{font-size:36px;margin-bottom:10px}.item p{font-size:24px;color:#ddd}.controls{display:flex;flex-direction:column;gap:15px;align-items:end}.qty{display:flex;align-items:center;gap:12px}.qty button{width:45px;height:45px;border:none;border-radius:12px;background:#ffb6d9;color:black;font-size:24px;font-weight:bold;cursor:pointer}.remove{background:#1b1b1b;color:#ffb6d9;border:1px solid #ffb6d9;padding:14px 22px;border-radius:16px;font-weight:bold;cursor:pointer}.total{font-size:55px;margin-top:40px;color:#ffb8d9;font-weight:bold}.checkout{display:block;margin-top:40px;background:#ffb8d9;color:black;padding:24px;border-radius:999px;text-align:center;font-size:24px;font-weight:bold;text-decoration:none}.empty{color:#777;font-size:30px}</style></head><body><header><div class="logo">ELINA</div><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="warenkorb.html">Warenkorb</a></nav></header><div class="container"><h1>Warenkorb</h1><div id="cart"></div><div class="total" id="total"></div><a href="checkout.html" class="checkout">Zur Zahlung</a></div><script>let cartData=JSON.parse(localStorage.getItem('elinaCart'))||[];const cart=document.getElementById('cart');const total=document.getElementById('total');cartData=cartData.map(item=>({...item,quantity:item.quantity||1}));function renderCart(){cart.innerHTML='';let sum=0;if(cartData.length===0){cart.innerHTML='<div class="empty">Dein Warenkorb ist leer.</div>';total.innerText='';return;}cartData.forEach((item,index)=>{sum+=item.price*item.quantity;cart.innerHTML+=`<div class="item"><div class="left"><img src="${item.image}"><div><h2>${item.name}</h2><p>Größe: ${item.size}</p><p>CHF ${item.price}</p></div></div><div class="controls"><div class="qty"><button onclick="changeQty(${index},-1)">-</button><p>${item.quantity}</p><button onclick="changeQty(${index},1)">+</button></div><button class="remove" onclick="removeItem(${index})">Entfernen</button></div></div>`});total.innerText='Gesamt: CHF '+sum.toFixed(2);localStorage.setItem('elinaCart',JSON.stringify(cartData));}function changeQty(index,amount){cartData[index].quantity+=amount;if(cartData[index].quantity<1){cartData[index].quantity=1;}renderCart();}function removeItem(index){cartData.splice(index,1);renderCart();}renderCart();</script></body></html>
