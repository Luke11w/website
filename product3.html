<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ELINA Oversized Tee</title><style>body{background:#050505;color:#fff;font-family:Arial;margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:25px 50px;background:#0b0b0b;border-bottom:1px solid #222}.logo{font-size:32px;font-weight:900;letter-spacing:4px}nav{display:flex;gap:25px}nav a{color:#fff;text-decoration:none;font-weight:bold}.product{display:grid;grid-template-columns:1.2fr 1fr;gap:60px;padding:60px}.gallery{display:grid;grid-template-columns:120px 1fr;gap:20px}.thumbs{display:flex;flex-direction:column;gap:12px}.thumbs img{width:100px;height:100px;object-fit:cover;border-radius:18px;cursor:pointer;background:#111}.main img{width:100%;border-radius:30px;background:#111}.info h1{font-size:60px}.price{font-size:42px;color:#ffb6d9;font-weight:bold;margin:25px 0}.sizes{display:flex;flex-wrap:wrap;gap:12px;margin:35px 0}.sizes button{width:74px;height:74px;border:none;border-radius:18px;background:#111;color:#fff;cursor:pointer}.sizes button.active,.sizes button:hover{background:#ffb6d9;color:#000}.cart{width:100%;padding:22px;border:none;border-radius:999px;background:#ffb6d9;color:#000;font-size:20px;font-weight:bold;opacity:.5}.cart.active{opacity:1;cursor:pointer}.desc{margin-top:40px;background:#0d0d0d;padding:30px;border-radius:30px;border:1px solid #222}</style></head><body><header><div class="logo">ELINA</div><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="warenkorb.html">Warenkorb</a></nav></header><div class="product"><div class="gallery"><div class="thumbs"><img src="unisex-organic-oversized-high-neck-blaster-2.0-t-shirt-black-front-6a07210d9b825.png" onclick="change(this)"><img src="unisex-organic-oversized-high-neck-blaster-2.0-t-shirt-black-front-6a07210d990dd.png" onclick="change(this)"><img src="unisex-organic-oversized-high-neck-blaster-2.0-t-shirt-black-front-6a07210d995e3.png" onclick="change(this)"><img src="unisex-organic-oversized-high-neck-blaster-2.0-t-shirt-black-left-6a07210d9ac84.png" onclick="change(this)"></div><div class="main"><img id="main" src="unisex-organic-oversized-high-neck-blaster-2.0-t-shirt-black-front-6a07210d9b825.png"></div></div><div class="info"><h1>ELINA Oversized Tee</h1><div class="price">CHF 44.90</div><p>Minimal oversized tee with luxury clean streetwear aesthetic.</p><div class="sizes"><button onclick="selectSize(this)">S</button><button onclick="selectSize(this)">M</button><button onclick="selectSize(this)">L</button><button onclick="selectSize(this)">XL</button><button onclick="selectSize(this)">2XL</button></div><button class="cart" id="cartBtn" disabled>Wähle zuerst eine Größe</button><div class="desc"><h2>Beschreibung</h2><ul><li>100% gekämmte ringgesponnene Bio-Baumwolle</li><li>Oversized Premium Fit</li><li>Luxury Streetwear Design</li><li>Breiter Kragen & schwerer Stoff</li><li>Minimal clean aesthetic</li></ul></div></div></div><script>function change(el){document.getElementById('main').src=el.src}let selectedSize='';function selectSize(btn){document.querySelectorAll('.sizes button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedSize=btn.innerText;const cart=document.getElementById('cartBtn');cart.disabled=false;cart.classList.add('active');cart.innerText='In den Warenkorb'}document.getElementById('cartBtn').onclick=function(){if(selectedSize==='')return;const product={name:'ELINA Oversized Tee',price:44.90,size:selectedSize,image:'unisex-organic-oversized-high-neck-blaster-2.0-t-shirt-black-front-6a07210d9b825.png'};let cart=JSON.parse(localStorage.getItem('elinaCart'))||[];cart.push(product);localStorage.setItem('elinaCart',JSON.stringify(cart));window.location.href='warenkorb.html'};</script></body></html>
